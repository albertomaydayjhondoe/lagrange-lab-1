name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: https://naikdjreibbugblihgwl.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZeZ0R4rQpNbvhEfHMjtQrQ_BrjDJXrc
  VITE_SUPABASE_PROJECT_ID: naikdjreibbugblihgwl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: |
          npm run build:ghpages
          # Copy GitHub Pages specific files to dist
          cp -r github-pages/* dist/
          # Fix placeholder.svg path in index.html for GH Pages
          sed -i 's|/placeholder.svg|/lagrange-lab-1/placeholder.svg|g' dist/index.html
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.VITE_SUPABASE_PROJECT_ID }}

      - name: Verify build output
        run: |
          echo "=== Build output ===" && ls -la dist/
          echo "=== Checking index.html ===" && head -20 dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
