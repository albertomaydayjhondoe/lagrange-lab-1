name: Deploy PaaS to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: https://naikdjreibbugblihgwl.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZeZ0R4rQpNbvhEfHMjtQrQ_BrjDJXrc
  VITE_SUPABASE_PROJECT_ID: naikdjreibbugblihgwl

jobs:
  deploy-paas:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PaaS
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.VITE_SUPABASE_PROJECT_ID }}
          VITE_APP_MODE: paas

      - name: Deploy PaaS to Vercel
        run: |
          npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --project=lagrange-lab-1 \
            --build-env VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }} \
            --build-env VITE_SUPABASE_PUBLISHABLE_KEY=${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }} \
            --build-env VITE_SUPABASE_PROJECT_ID=${{ env.VITE_SUPABASE_PROJECT_ID }} \
            --build-env VITE_APP_MODE=paas
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-supabase-functions:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fix: Authenticate to Docker Hub to avoid anonymous rate limits
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Supabase CLI
        run: npm install -g supabase@latest

      - name: Link Supabase Project
        run: npx supabase link --project-ref naikdjreibbugblihgwl
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          echo "Deploying all edge functions..."
          for func in \
            socratic-oracle \
            tutoring-oracle \
            ingest-source \
            external-research \
            save-dialogue \
            book-session \
            create-session \
            list-sessions \
            cancel-booking \
            process-payment \
            regenerate-topology-delta \
            fog-teaser \
            generate-ambient-narrative \
            list-academies \
            get-academy; do
            echo "=== Deploying $func ==="
            npx supabase functions deploy $func --no-verify-jwt 2>&1
            echo ""
          done
          echo "All functions deployed!"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
          AI_CHAT_MODEL: ${{ secrets.AI_CHAT_MODEL }}
          AI_EMBEDDING_MODEL: ${{ secrets.AI_EMBEDDING_MODEL }}

      # Migrations are applied via Management API - uncomment if needed
      # - name: Push Migrations
      #   run: npx supabase db push --include-all
      #   env:
      #     SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
